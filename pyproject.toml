[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rational-elliptic-diagnostics"
version = "0.1.0"
description = "Integer diagnostics for rational elliptic curves in short Weierstrass form"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
